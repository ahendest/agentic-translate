name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, as for a user's agent; setup-python provides `python` everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: env PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools -p 'test_*.py'
      - name: Build an empty store per source language and audit it
        run: |
          python -B tools/knowledge.py --config knowledge/config.json --source-language tr init
          python -B tools/knowledge.py --config knowledge/config.json --source-language tr import-lugat --input knowledge/sources/db_lugat.sql
          python -B tools/knowledge.py --config knowledge/config.json --source-language ar init
          for source in ar tr; do
            python -B tools/knowledge.py --config knowledge/config.json --source-language $source integrity
          done
